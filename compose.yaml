x-orthex-preview:
  webService: web
  webPort: 8080
  healthPath: /
  databaseService: mongo

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: "mongodb://mongo:27017/stady?directConnection=true"
      JWT_SECRET: "9f3c1b7a52d84e60c1a7b9d3f5e80246a9c4b7d1e60f3825a7c9b1d4e6f80327"
      NODE_ENV: production
      PORT: "5000"
      CORS_ORIGINS: "*"
    depends_on:
      - mongo
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  mongo:
    image: mongo:7.0
    volumes:
      - stady_mongo:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  stady_mongo: {}
